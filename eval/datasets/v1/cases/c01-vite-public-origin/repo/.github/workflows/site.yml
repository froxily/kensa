name: Site checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Fetch source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          check-latest: false
      - name: Restore packages
        run: npm install
      - name: Compile site
        run: npm run build

