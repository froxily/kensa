name: Go suite
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Clone code
        uses: actions/checkout@v4
      - name: Configure Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
      - name: Download modules
        run: go mod download
      - name: Vet packages
        run: go vet ./...
      - name: Run unit suite
        env:
          SERVICE_MODE: test
        run: go test -v ./...
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: results/
