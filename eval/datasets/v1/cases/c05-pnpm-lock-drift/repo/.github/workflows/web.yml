name: Web validation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Retrieve source
        uses: actions/checkout@v4
      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - name: Choose Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Compile web bundle
        run: pnpm build
