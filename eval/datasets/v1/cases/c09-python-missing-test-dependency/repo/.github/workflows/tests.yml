name: Parser tests
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  test-parser:
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install runtime and test runner
        run: pip install -r requirements-ci.txt
      - name: Show installed packages
        run: pip list
      - name: Collect and run tests
        run: python -m pytest tests
      - name: Save report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: report.xml
