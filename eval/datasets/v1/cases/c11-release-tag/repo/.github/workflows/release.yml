name: Release package
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test package
        run: npm test
      - name: Create release tag
        run: |
          git config user.name 'release-bot'
          git config user.email 'bot@users.noreply.invalid'
          git tag "v$(node -p "require('./package.json').version")"
          git push origin --tags
