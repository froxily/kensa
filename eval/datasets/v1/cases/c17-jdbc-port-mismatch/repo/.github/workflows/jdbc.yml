name: JDBC integration
on:
  push:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: catalog
        ports:
          - 5544:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run JDBC test
        run: mvn -B test
