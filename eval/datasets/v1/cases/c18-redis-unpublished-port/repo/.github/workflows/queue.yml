name: Queue integration
on:
  pull_request:
  push:
jobs:
  queue:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-retries 5
    steps:
      - name: Checkout queue
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false
      - name: Fetch modules
        run: go mod download
      - name: Test queue connection
        run: go test -v ./...
