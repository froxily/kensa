name: Python package check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  wheel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ci
    steps:
      - name: Retrieve tree
        uses: actions/checkout@v4
      - name: Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install builder
        run: python -m pip install build
      - name: Inspect selected manifest
        run: pwd && head -n 12 pyproject.toml
      - name: Build wheel
        run: python -m build --wheel
      - name: Store wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: service/dist/*.whl
