name: Gateway tests
on:
  push:
  pull_request:
jobs:
  gateway:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      - name: Download modules
        run: go mod download
      - name: Test routing
        run: go test -v ./...
      - name: Save results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: routing-output
          path: test-output.txt
          if-no-files-found: ignore
