name: Queue test
on:
  push:
  pull_request:
jobs:
  concurrency:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Inspect module
        run: go list ./...
      - name: Run queue tests
        run: go test -v -timeout 4m ./...
      - name: Save diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: queue-diagnostics
          path: diagnostics/
          if-no-files-found: ignore
          retention-days: 1
