name: Publish image
on: [push]
permissions:
  contents: read
  packages: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Login
        run: echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          REGISTRY_TOKEN: ${{ github.token }}
      - run: docker build -t ghcr.io/inkhouse/quill:latest .
      - run: docker push ghcr.io/inkhouse/quill:latest
