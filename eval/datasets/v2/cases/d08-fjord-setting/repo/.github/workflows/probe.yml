name: Config probe
on: [push]
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: kotlinc src/Probe.kt -include-runtime -d probe.jar
      - run: java -jar probe.jar
