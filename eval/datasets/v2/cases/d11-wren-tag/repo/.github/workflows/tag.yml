name: Tag build
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  tag:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: swift build -c release
      - name: Create tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/$GITHUB_REPOSITORY/git/refs -f ref=refs/tags/build-1 -f sha=$GITHUB_SHA
