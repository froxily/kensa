name: Storage tests
on: [push]
jobs:
  storage:
    runs-on: ubuntu-24.04
    services:
      store:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - run: cargo test -- --nocapture
        env:
          SABLE_DB_ADDR: 127.0.0.1:5433
