name: Storage checks
on: [push]
jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      catalog:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: azalea_data
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pytest -v
        env:
          AZALEA_DSN: postgresql://postgres@127.0.0.1:5432/azalea_archive
