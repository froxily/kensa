name: Report generation
on: [push]
jobs:
  report:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: mkdir -p classes && javac -d classes src/Willow.java
      - name: Generate report
        run: |
          mkdir -p out
          java -Xmx32m -cp classes Willow
