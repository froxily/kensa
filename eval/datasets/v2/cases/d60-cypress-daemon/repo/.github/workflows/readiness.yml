name: Image readiness
on: [push]
jobs:
  verify:
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify runtime and daemon
        run: |
          node --test
          docker info
        env:
          DOCKER_HOST: tcp://127.0.0.1:2379
