name: Address TestNG
on: [push]
jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Fetch compiler and runner
        run: |
          curl -fsSLo kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v2.1.20/kotlin-compiler-2.1.20.zip
          unzip -q kotlin.zip -d compiler
          curl -fsSLo testng.jar https://repo.maven.apache.org/maven2/org/testng/testng/7.10.2/testng-7.10.2.jar
          curl -fsSLo jcommander.jar https://repo.maven.apache.org/maven2/com/beust/jcommander/1.82/jcommander-1.82.jar
          curl -fsSLo slf4j.jar https://repo.maven.apache.org/maven2/org/slf4j/slf4j-api/2.0.13/slf4j-api-2.0.13.jar
      - name: Compile and run address tests
        run: |
          compiler/kotlinc/bin/kotlinc src/main/kotlin/AddressMask.kt src/test/kotlin/AddressSpec.kt -classpath testng.jar -include-runtime -d addresses.jar
          java -cp addresses.jar:testng.jar:jcommander.jar:slf4j.jar org.testng.TestNG -testclass AddressSpec -verbose 2
