name: Route probe
on: [push]
jobs:
  route:
    runs-on: ubuntu-24.04-arm
    services:
      silo:
        image: memcached:1.6
        ports:
          - 6435:11211
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: mkdir -p target && javac -d target native/RouteProbe.java
      - run: java -cp target RouteProbe
