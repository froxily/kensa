name: Review submission
on: [workflow_dispatch]
permissions:
  contents: read
  pull-requests: read
jobs:
  review:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - run: go run tasks/submit_review.go
        env:
          GO111MODULE: 'off'
          JUNCO_REVIEW_TOKEN: ${{ github.token }}
