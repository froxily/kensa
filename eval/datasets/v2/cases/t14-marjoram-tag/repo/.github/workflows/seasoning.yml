name: PHP image
on: [push]
jobs:
  image:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - name: Inspect PHP and build
        run: |
          php -v
          php --ri json
          php --ri pcre
          php --ri date
          docker build -f PHPImageSpec -t 'Marjoram/WEB:Latest' .
