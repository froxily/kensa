name: Callback preparation
on: [pull_request]
jobs:
  prepare:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install kotlin
      - name: Prepare callbacks
        run: kotlinc -script scripts/launch.kts
        env:
          CALAMINT_CALLBACK: ${{ secrets.CALAMINT_CALLBACK }}
