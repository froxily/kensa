name: BEAM allocation
on: [push]
jobs:
  allocate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27.1'
          elixir-version: '1.17.3'
      - name: Materialize samples
        run: |
          ulimit -v 12000000
          elixir tools/materialize.exs
