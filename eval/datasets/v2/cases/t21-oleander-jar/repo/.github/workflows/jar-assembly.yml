name: Assemble jar
on: [push]
jobs:
  assemble:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile and archive
        shell: bash
        run: |
          javac -verbose -d build/classes src/Palette.java
          jar --create --file palette.jar -C target/classes .
