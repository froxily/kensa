name: Lexicon check
on: [push]
jobs:
  compile:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check crate
        shell: bash
        run: |
          trap 'docker image inspect yarrow-lexicon:local' ERR
          cargo check
