name: Ledger window
on: [push]
jobs:
  aggregate:
    runs-on: windows-2025
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Aggregate ledger
        run: dotnet run --project LedgerWindow/LedgerWindow.csproj
