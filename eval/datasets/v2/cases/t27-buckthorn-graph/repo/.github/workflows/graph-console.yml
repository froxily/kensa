name: Graph console
on: [push]
jobs:
  graph:
    runs-on: ubuntu-24.04-arm
    services:
      arborgraph:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: none
        ports:
          - 17474:7474
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Fetch Kotlin and JUnit
        run: |
          curl -fsSLo kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip
          unzip -q kotlin.zip -d compiler
          curl -fsSLo junit-console.jar https://repo.maven.apache.org/maven2/org/junit/platform/junit-platform-console-standalone/1.11.3/junit-platform-console-standalone-1.11.3.jar
      - name: Wait for graph service
        run: timeout 120 bash -c 'until curl -fsS http://127.0.0.1:17474/ >/dev/null; do sleep 2; done'
      - name: Compile and query
        run: |
          set -o pipefail
          compiler/kotlinc/bin/kotlinc src/test/kotlin/GraphQueryTest.kt -classpath junit-console.jar -include-runtime -d graph-checks.jar
          java -jar junit-console.jar execute --class-path graph-checks.jar --select-class GraphQueryTest --details verbose --disable-banner --disable-ansi-colors | sed '/^\[/d'
