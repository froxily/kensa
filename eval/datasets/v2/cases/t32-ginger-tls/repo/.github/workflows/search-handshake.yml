name: Search handshake
on: [push]
jobs:
  search:
    runs-on: ubuntu-22.04
    services:
      searchnode:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
        env:
          discovery.type: single-node
          xpack.security.enabled: 'false'
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 19200:9200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r search-requirements.txt
      - name: Wait for search node
        run: timeout 120 bash -c 'until curl -fsS http://127.0.0.1:19200/ >/dev/null; do sleep 2; done'
      - name: Inspect cluster
        run: python inspect_search.py
