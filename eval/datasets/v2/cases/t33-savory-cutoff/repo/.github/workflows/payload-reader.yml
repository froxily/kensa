name: Payload reader
on: [push]
jobs:
  read:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Read catalog status
        run: |
          java -XshowSettings:properties -version
          java tasks/CatalogStatus.java
