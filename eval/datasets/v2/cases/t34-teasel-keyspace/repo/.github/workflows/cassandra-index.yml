name: Cassandra index
on: [push]
jobs:
  probe:
    runs-on: ubuntu-22.04
    services:
      chronicle:
        image: cassandra:4.1
        ports:
          - 19042:9042
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false
      - run: python -m pip install cqlsh==6.2.0
      - name: Wait for Cassandra
        run: timeout 180 bash -c 'until cqlsh 127.0.0.1 19042 -e "DESCRIBE KEYSPACES" >/dev/null 2>&1; do sleep 5; done'
      - name: Probe index
        run: go run tasks/probe_index.go
