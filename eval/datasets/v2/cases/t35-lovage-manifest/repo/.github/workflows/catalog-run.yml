name: Catalog run
on: [push]
jobs:
  catalog:
    runs-on: macos-14
    defaults:
      run:
        working-directory: projects/catalog-cli
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.90.0'
      - name: Test and build catalog
        run: |
          cargo test
          cargo build --release --target-dir build-output
          ./target/release/lovage-inspect
