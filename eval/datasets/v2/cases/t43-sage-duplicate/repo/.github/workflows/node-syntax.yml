name: Node syntax
on: [push]
jobs:
  checks:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check units and release command
        run: |
          node --test checks/units.test.mjs
          node --check tools/phase-release.mjs
