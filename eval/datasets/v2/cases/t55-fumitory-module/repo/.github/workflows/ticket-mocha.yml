name: Ticket Mocha
on: [push]
jobs:
  test:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install test runner
        run: npm install --no-audit --no-fund
      - name: Run ticket checks
        run: npm test
