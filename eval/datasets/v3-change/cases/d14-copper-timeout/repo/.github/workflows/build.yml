name: Copper build
on: push
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build Copper/Copper.csproj
      - run: dotnet run --project Copper/Copper.csproj
