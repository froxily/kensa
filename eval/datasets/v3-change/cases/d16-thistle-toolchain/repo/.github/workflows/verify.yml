name: Verify
on: [push]
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: gcc --version
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install --no-build-isolation .
      - run: python -m pytest -q
