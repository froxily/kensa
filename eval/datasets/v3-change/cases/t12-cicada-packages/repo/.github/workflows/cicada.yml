name: Cicada package
on:
  push:
    branches: [main]
permissions:
  contents: read
  packages: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false
      - name: Test
        run: go test ./...
      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        run: docker build -t ghcr.io/vesperfield/cicada:ci .
      - name: Push image
        run: docker push ghcr.io/vesperfield/cicada:ci
