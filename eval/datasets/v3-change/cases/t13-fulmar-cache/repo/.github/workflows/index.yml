name: Index build
on: [push]
jobs:
  assemble:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: javac -d out src/AtlasIndex.java
      - run: java -Xmx256m -cp out AtlasIndex
