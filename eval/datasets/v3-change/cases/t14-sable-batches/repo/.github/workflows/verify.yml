name: Verification
on: [push]
jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        batch: [["ledger", "archive"]]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Run batches
        env:
          BATCHES: ${{ join(matrix.batch, ' ') }}
        run: |
          for batch in $BATCHES; do
            python -m pytest "tests/test_${batch}.py" -v
          done
